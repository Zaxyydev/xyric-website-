<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XYRIC — Aurora Glass Control</title>
<style>
:root{--bg:#0e0b1c;--card:#191531;--card2:#211c40;--line:#2f2958;--tx:#f4f2ff;--mu:#9b96bd;--ac:#8b5cf6;--ac2:#ec4899}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh}
button{font:inherit;cursor:pointer}
.grad{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
#login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#3b1d7a55,transparent 50%),radial-gradient(circle at 80% 90%,#ec489944,transparent 50%)}
.lc{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;box-shadow:0 20px 60px #0008}
.lc .lg{width:60px;height:60px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;font-size:28px}
.lc h1{text-align:center;margin:0;font-size:22px}.lc p{text-align:center;color:var(--mu);font-size:13px;margin:4px 0 14px}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
input[type=text],input[type=password],select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:#120f26;color:var(--tx);font-size:15px;outline:0}
input:focus,select:focus{border-color:var(--ac)}
.btn{width:100%;padding:13px;border-radius:12px;font-weight:700;margin-top:14px;font-size:15px}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
#err{color:#ff7b8a;font-size:13px;min-height:18px;text-align:center;margin-top:10px}
#app{display:none;height:100dvh;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header b{flex:1;font-size:16px}
.seg{display:flex;background:#120f26;border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--mu);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px}
.seg button.on{background:var(--card2);color:#fff}
.ib{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600}
.wrap{flex:1;display:grid;grid-template-columns:1fr;min-height:0}
.ed{overflow:auto;padding:14px;padding-bottom:140px}
.pv{display:none;background:#05040c;align-items:center;justify-content:center;padding:12px;min-height:0}
#app.sp .ed{display:none}#app.sp .pv{display:flex}
.fr{width:100%;max-width:390px;height:100%;border:6px solid #2a2450;border-radius:28px;background:#000;overflow:hidden}
.fr iframe{width:100%;height:100%;border:0;background:#111}
@media(min-width:900px){.wrap{grid-template-columns:minmax(380px,520px) 1fr}.seg{display:none}#app.sp .ed{display:block}.pv{display:flex}}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
details>summary{list-style:none;padding:15px 16px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"\25BE";margin-left:auto;color:var(--mu);transition:.2s}
details[open]>summary::after{transform:rotate(180deg)}
.in{padding:0 16px 16px}
details.cd{background:var(--card2);border-radius:12px;margin-top:10px;border:1px solid var(--line)}
details.cd>summary{padding:12px;font-size:14px}details.cd>summary small{color:var(--mu);font-weight:400}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1}
.dl{background:#3a1626;color:#ff8da0;border:1px solid #5b2237;border-radius:10px;padding:9px 12px;font-weight:600}
.add{background:none;border:1px dashed var(--line);color:var(--ac);border-radius:12px;padding:12px;width:100%;margin-top:12px;font-weight:700}
input[type=file]{width:100%;padding:10px;border:1px dashed var(--line);border-radius:12px;background:#120f26;color:var(--mu);font-size:13px}
input[type=file]::file-selector-button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 11px;margin-right:10px;font-weight:700}
.th{width:60px;height:60px;border-radius:10px;object-fit:cover;margin-top:8px;display:block}
.hint{font-size:12px;color:var(--mu);margin-top:6px;line-height:1.4}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 25%);display:flex;flex-direction:column;gap:8px;z-index:5}
@media(min-width:900px){.bar{right:auto;width:min(520px,45vw)}}
.bar .r{display:flex;gap:8px}.bar .r>*{flex:1}
#st{font-size:12px;color:var(--mu);text-align:center}
.bar .btn{margin:0}

/* XYRIC Aurora Glass redesign — visual layer, existing editor logic retained */
:root{--bg:#050914;--card:rgba(13,24,47,.66);--card2:rgba(21,36,67,.72);--line:rgba(151,190,255,.20);--tx:#f2f7ff;--mu:#9eafcc;--ac:#72d7ff;--ac2:#a58bff}
html{background:#050914;scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 12% 8%,rgba(39,123,255,.22),transparent 38%),radial-gradient(ellipse at 88% 26%,rgba(147,79,255,.19),transparent 36%),radial-gradient(ellipse at 52% 100%,rgba(0,219,201,.11),transparent 42%),#050914;background-attachment:fixed;letter-spacing:.01em}
body:before{content:"";position:fixed;inset:-25%;pointer-events:none;z-index:0;background:conic-gradient(from 160deg at 50% 50%,transparent 0 20%,rgba(67,153,255,.055) 28%,transparent 38%,rgba(159,103,255,.06) 53%,transparent 68%);filter:blur(45px);animation:auroraDrift 24s ease-in-out infinite alternate}
@keyframes auroraDrift{from{transform:translate3d(-2%,1%,0) rotate(-5deg)}to{transform:translate3d(2%,-1%,0) rotate(7deg)}}
button,input,select,details,header,.bar,.lc,.fr{position:relative}
#login{position:relative;z-index:1;background:transparent}
.lc{background:linear-gradient(145deg,rgba(22,39,72,.78),rgba(10,17,34,.74));border:1px solid rgba(185,218,255,.28);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);box-shadow:0 28px 90px #0008,inset 0 1px 0 rgba(255,255,255,.13);overflow:hidden}

header{background:rgba(7,14,29,.70);border-bottom:1px solid rgba(163,199,255,.18);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);padding:13px 16px;box-shadow:0 8px 30px #0002}
header:after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#75dfff88,#a78bfa88,transparent)}
header b{font-size:17px;letter-spacing:-.025em}header b:before{content:"✦";display:inline-grid;place-items:center;width:30px;height:30px;margin-right:9px;border-radius:10px;color:#b8f2ff;background:linear-gradient(135deg,#53cfff30,#a68bff35);border:1px solid #a9dfff38}
.seg{background:rgba(5,12,26,.65);border:1px solid var(--line);border-radius:13px;padding:4px}.seg button{border-radius:10px}.seg button.on{background:linear-gradient(135deg,rgba(78,201,255,.25),rgba(151,119,255,.28));box-shadow:inset 0 0 0 1px #b4eaff32;color:#fff}
.ib{background:rgba(255,255,255,.045);border:1px solid rgba(181,211,255,.23);backdrop-filter:blur(12px);transition:transform .18s,border-color .18s,background .18s}.ib:hover{border-color:#8ee6ff88;background:#75dfff13;transform:translateY(-1px)}
.grad{background:linear-gradient(110deg,#36bfe9,#6c8bff 48%,#a57bff);box-shadow:0 8px 26px rgba(70,154,255,.22),inset 0 1px 0 #ffffff48;transition:transform .18s,filter .18s,box-shadow .18s}.grad:hover{filter:brightness(1.09);transform:translateY(-1px);box-shadow:0 12px 32px rgba(70,154,255,.3),inset 0 1px 0 #ffffff55}.grad:active{transform:scale(.985)}
.ed{padding:18px 16px 170px;scrollbar-width:thin;scrollbar-color:#5c80b766 transparent}
.ed:before{content:"CONTROL CENTER";display:block;font-size:10px;letter-spacing:.22em;font-weight:800;color:#8ddfff;margin:2px 3px 7px;text-shadow:0 0 18px #65cfff55}
.ed:after{content:"Kelola konten, tampilan, dan media XYRIC dari satu tempat.";display:block;font-size:12px;color:var(--mu);margin:0 3px 17px}
details.sec{background:linear-gradient(145deg,rgba(20,36,66,.74),rgba(9,17,34,.66));border:1px solid rgba(157,197,255,.19);border-radius:18px;margin-bottom:13px;overflow:hidden;box-shadow:0 10px 28px #00000018,inset 0 1px 0 rgba(255,255,255,.045);backdrop-filter:blur(20px) saturate(135%);-webkit-backdrop-filter:blur(20px) saturate(135%);transition:border-color .2s,transform .2s,box-shadow .2s}
details.sec[open]{border-color:rgba(112,218,255,.38);box-shadow:0 14px 34px #0002,0 0 0 1px #6edcff0b,inset 0 1px 0 #ffffff0a}
details>summary{padding:16px 16px;min-height:54px;font-size:14px;letter-spacing:.005em}details>summary:before{content:"";width:4px;height:22px;border-radius:8px;background:linear-gradient(#67ddff,#9c8aff);box-shadow:0 0 14px #67ddff55;margin-right:1px}details>summary::after{content:"＋";font-size:17px;color:#9ddfff;transform:none}details[open]>summary::after{content:"−";transform:none}
.in{padding:0 16px 17px}
label{color:#b5c9e8;font-size:11px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;margin:15px 0 7px}
input[type=text],input[type=password],select{background:rgba(3,10,23,.58);border:1px solid rgba(154,190,239,.20);border-radius:12px;color:#f2f7ff;padding:12px 13px;box-shadow:inset 0 1px 5px #0002;transition:border-color .2s,box-shadow .2s,background .2s}
input[type=text]:focus,input[type=password]:focus,select:focus{border-color:#71dfff;box-shadow:0 0 0 3px #5fd5ff17,0 0 20px #5fd5ff0d;background:rgba(6,17,34,.86)}
input::placeholder{color:#6e83a5}
input[type=file]{background:rgba(3,10,23,.38);border:1px dashed rgba(122,207,255,.35);border-radius:13px;color:#a8bbd9}input[type=file]::file-selector-button{background:linear-gradient(120deg,#31bce8,#777eff);border-radius:9px;box-shadow:0 4px 14px #49bfff24}
.th{width:84px;height:84px;border-radius:15px;border:1px solid #b3e6ff38;box-shadow:0 8px 24px #0004;object-fit:cover}
.hint{color:#91a7c8;line-height:1.55}
details.cd{background:rgba(6,14,29,.53);border:1px solid rgba(145,188,239,.15);border-radius:14px;overflow:hidden}details.cd[open]{border-color:#70dfff50}details.cd>summary{font-size:13px}details.cd>summary:before{display:none}details.cd>summary::after{font-size:14px}
.row{align-items:center}.row input{min-width:0}.dl{background:rgba(255,101,133,.09);border-color:rgba(255,120,153,.24);transition:background .18s}.dl:hover{background:rgba(255,101,133,.17)}
.add{border:1px dashed rgba(115,219,255,.38);background:rgba(68,192,255,.055);color:#8fe7ff;border-radius:13px;transition:background .2s,border-color .2s}.add:hover{background:rgba(68,192,255,.12);border-color:#8fe7ff}
.bar{background:linear-gradient(180deg,transparent,rgba(4,9,20,.78) 18%,rgba(4,9,20,.96));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(149,190,255,.13);padding-top:17px}.bar .btn{min-height:44px;border-radius:13px}.bar .ghost{background:rgba(255,255,255,.045);border:1px solid rgba(161,195,245,.19);color:#dce9ff}.bar .ghost:hover{background:#79dfff12;border-color:#79dfff66}#st{line-height:1.45;padding:0 6px}
.pv{background:radial-gradient(ellipse at 50% 0%,#163a63,transparent 55%),#040814}.fr{border-color:rgba(155,210,255,.28);box-shadow:0 25px 80px #0009,0 0 40px #6bcfff13}
@media(min-width:900px){.ed{padding:24px 22px 150px}.ed:before,.ed:after{max-width:650px}.bar{width:min(520px,45vw);padding-left:22px;padding-right:22px}}
@media(max-width:480px){header{padding:11px 12px}header b{font-size:15px}.ed{padding:14px 11px 172px}details>summary{padding:14px 13px}.in{padding-left:13px;padding-right:13px}.bar{padding-left:11px;padding-right:11px}.bar .r{gap:7px}.bar .btn{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

.cnt{min-width:30px;text-align:center;font-size:12px;font-weight:800;color:#bfeeff;background:rgba(114,215,255,.12);border:1px solid rgba(114,215,255,.28);border-radius:999px;padding:6px 8px}
.mv{background:rgba(255,255,255,.06);border:1px solid rgba(181,211,255,.23);color:#cfe6ff;border-radius:10px;padding:9px 10px;font-size:11px;line-height:1}
.mv:hover{background:#79dfff1f;border-color:#79dfff77}
.bar .r{flex-wrap:wrap}.bar .r>*{min-width:90px}
</style></head><body>
<div id="login"><div class="lc"><div class="lg grad">&#128272;</div><h1>Admin Login</h1><p>Masuk untuk mengelola halaman</p>
<label>Username</label><input type="text" id="u" autocomplete="username" autocapitalize="off"><label>Password</label><input type="password" id="pw" autocomplete="current-password">
<div id="err"></div><button class="btn grad" id="go">Masuk</button></div></div>

<div id="app"><header><b>XYRIC <span style="font-size:11px;color:#8edfff;font-weight:700;letter-spacing:.13em">AURORA CONTROL</span></b><div class="seg"><button class="on" data-v="ed">Editor</button><button data-v="pv">Preview</button></div><button class="ib" id="out">Keluar</button></header>
<div class="wrap"><div class="ed" id="fm"></div><div class="pv"><div class="fr"><iframe id="pf" src="index.html" title="preview"></iframe></div></div></div>
<div class="bar"><div id="st"></div><button class="btn grad" id="pub">&#9729; Simpan &amp; Publish</button><div class="r"><button class="btn ghost" id="dlj">&#11015; data.json</button><button class="btn ghost" id="imp">Impor</button><button class="btn ghost" id="rl">&#8635; Server</button></div><input type="file" id="impf" accept=".json" hidden></div></div>

<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF={name:'Ogegaugaw',mA:'',mT:'',avatar:'',musicCover:'',backgroundImage:'',backgroundType:'video',video:'',audio:'',tabs:[{id:'main',n:'Main'}],cards:[],soc:['#','#','#','#']};
let S=DEF,openC=-1,dirty=false;
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const FBc=window.FB||{},DB=(FBc.databaseURL||'').replace(/\/$/,''),useFB=!!(FBc.apiKey&&DB);
let tok=null,cred=null;
const toEmail=u=>u.includes('@')?u:u+'@'+(FBc.adminDomain||'ogegaugaw.app');
async function fbLogin(email,pw){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FBc.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'gagal');tok=j.idToken;cred={email,pw}}
async function login(){const u=$('#u').value.trim(),pw=$('#pw').value;$('#err').textContent='';
 try{if(useFB)await fbLogin(toEmail(u),pw);else if((await sha(u+':'+pw))!=='d62cc750d228328b96be8814ed24212db71de2f99b5b0e8cc479a82c6b133d9f')throw new Error('INVALID')}
 catch(e){$('#err').textContent=/INVALID|PASSWORD|EMAIL|CREDENTIALS|USER/.test(e.message)?'Username atau password salah':'Gagal masuk: '+e.message;return}
 $('#login').style.display='none';$('#app').style.display='flex';await load();form();sendPv()}
$('#go').onclick=login;$('#pw').addEventListener('keydown',e=>e.key==='Enter'&&login());
$('#out').onclick=()=>location.reload();
const arr=x=>Array.isArray(x)?x:Object.values(x||{});
function norm(s){s.tabs=arr(s.tabs).filter(x=>x&&x.id!=null);const seen=new Set();s.tabs=s.tabs.filter(x=>!seen.has(x.id)&&seen.add(x.id));if(!s.tabs.length)s.tabs=[{id:'main',n:'Main'}];const ids=new Set(s.tabs.map(x=>x.id)),first=s.tabs[0].id;s.cards=arr(s.cards).map(c=>Object.assign({tab:first,t:'',s:'',u:'#',img:''},c)).filter(c=>ids.has(c.tab));s.soc=arr(s.soc);while(s.soc.length<4)s.soc.push('#');return s}
async function load(){let d=null;try{d=JSON.parse(localStorage.getItem('draft')||'null');if(d)dirty=true}catch(e){}
 if(!d&&useFB){try{const r=await fetch(DB+'/site.json',{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}}
 if(!d){try{const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}}
 if(d&&d.music){d.mT=d.music.title??d.mT;d.mA=d.music.artist??d.mA;d.musicCover=d.music.cover??d.musicCover;d.audio=d.music.audio??d.audio}if(d&&d.background){d.video=d.background.type==='video'?(d.background.src||d.video):d.video;d.backgroundImage=d.background.type==='image'?(d.background.src||''):d.backgroundImage;d.backgroundType=d.background.type||d.backgroundType}S=norm(Object.assign({},DEF,d||{}));st()}
async function reloadServer(){if(dirty&&!confirm('Buang perubahan yang belum dipublish dan muat ulang dari server?'))return;try{localStorage.removeItem('draft')}catch(e){}dirty=false;await load();dirty=false;st();form();sendPv();$('#st').textContent='↻ Data dimuat ulang dari server.'}
function st(){$('#st').textContent=dirty?'● Ada perubahan yang belum dipublish (draft lokal).':(useFB?'Terhubung ke Firebase.':'Mode lokal: isi config.js untuk Firebase.')}
let pt;function sendPv(){clearTimeout(pt);pt=setTimeout(()=>{try{$('#pf').contentWindow.postMessage({type:'preview',data:S},'*')}catch(e){}},120)}
$('#pf').addEventListener('load',()=>{sendPv();setTimeout(sendPv,600)});
function changed(){dirty=true;try{localStorage.setItem('draft',JSON.stringify(S))}catch(e){}st();sendPv()}
$$('.seg button').forEach(b=>b.onclick=()=>{$$('.seg button').forEach(x=>x.classList.toggle('on',x===b));$('#app').classList.toggle('sp',b.dataset.v==='pv');sendPv()});
const tn=id=>(S.tabs.find(t=>t.id===id)||{}).n||'';
const thumb=v=>v&&/^(data:|https?:|\/|[\w.-]+\.(png|jpe?g|webp|gif))/i.test(v)?'<img class="th" src="'+esc(v)+'" alt="">':(v?'<div class="hint">Gambar bawaan halaman</div>':'');
function form(){
 const I=(p,l,v,h)=>'<label>'+l+'</label><input type="text" data-p="'+p+'" value="'+esc(v)+'">'+(h?'<div class="hint">'+h+'</div>':''),
 F=(k,l)=>'<label>'+l+'</label><input type="file" accept="image/*" data-up="'+k+'">',
 sec=(t,b,o)=>'<details class="sec"'+(o?' open':'')+'><summary>'+t+'</summary><div class="in">'+b+'</div></details>';
 let f=sec('&#128100; Profil',I('name','Nama',S.name)+F('avatar','Foto profil')+thumb(S.avatar),1);
 f+=sec('&#127925; Musik',I('mA','Artis',S.mA)+I('mT','Judul lagu',S.mT)+F('musicCover','Foto cover musik')+thumb(S.musicCover)+I('audio','URL / nama file MP3',S.audio,'Isi URL MP3 publik atau nama file MP3 yang sudah ada di hosting. API key tidak diperlukan untuk file MP3 publik.' )+'<div class="hint">Catatan: browser biasanya memerlukan sentuhan pertama pengguna sebelum musik boleh diputar otomatis.</div>');
 f+=sec('&#127911; Background / Latar',I('video','URL / nama file video latar',S.video,'Contoh: video.mp4 di folder website.')+F('backgroundImage','Pilih gambar latar')+thumb(S.backgroundImage)+I('backgroundType','Tipe latar (video / image / gradient)',S.backgroundType||'video','Pilih video, image, atau gradient. Gambar yang dipilih disimpan sebagai data URL di data.json/Firebase.')); 
 const cn=id=>S.cards.filter(c=>c.tab===id).length;
 f+=sec('&#128193; Kategori ('+S.tabs.length+')','<div class="hint" style="margin-top:0">Kategori pertama = <b>Main</b>, otomatis menampilkan semua produk dari semua kategori. Kategori lain hanya menampilkan produknya sendiri.</div>'+S.tabs.map((t,i)=>'<div class="row"><input type="text" data-p="tabs.'+i+'.n" value="'+esc(t.n)+'"><span class="cnt" title="jumlah produk">'+(i?cn(t.id):S.cards.length)+'</span>'+(i>1?'<button class="mv" data-mv="u'+i+'" aria-label="Naik">&#9650;</button>':'')+(i&&i<S.tabs.length-1?'<button class="mv" data-mv="d'+i+'" aria-label="Turun">&#9660;</button>':'')+(i?'<button class="dl" data-del="t'+i+'">Hapus</button>':'')+'</div>').join('')+'<div class="row"><input type="text" id="nt" placeholder="Nama kategori baru"><button class="dl" style="background:var(--ac);color:#08111f;border:0" id="at">Tambah</button></div>');
 f+=sec('&#128279; Kartu link ('+S.cards.length+')',S.cards.map((c,i)=>'<details class="cd"'+(i===openC?' open':'')+'><summary>'+esc(c.t||'(tanpa judul)')+' <small>'+esc(tn(c.tab))+'</small></summary><div class="in"><label>Kategori</label><select data-p="cards.'+i+'.tab">'+S.tabs.map(t=>'<option value="'+esc(t.id)+'"'+(t.id===c.tab?' selected':'')+'>'+esc(t.n)+'</option>').join('')+'</select>'+I('cards.'+i+'.t','Judul',c.t)+I('cards.'+i+'.s','Deskripsi',c.s)+I('cards.'+i+'.u','Link',c.u)+F('card'+i,'Gambar')+thumb(c.img)+'<button class="dl" style="margin-top:12px" data-del="c'+i+'">Hapus kartu</button></div></details>').join('')+'<button class="add" id="ac">+ Tambah kartu</button>',1);
 f+=sec('&#127760; Sosial media',['TikTok','Instagram','Facebook','Discord'].map((n,i)=>I('soc.'+i,n,S.soc[i]||'#')).join(''));
 const op=$$('#fm details.sec').map(d=>d.open);$('#fm').innerHTML=f;if(form.k)$$('#fm details.sec').forEach((d,i)=>d.open=op[i]);form.k=1}
function setp(p,v){const a=p.split('.');let o=S;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
$('#fm').addEventListener('input',e=>{const p=e.target.dataset.p;if(p){setp(p,e.target.value);changed()}});
$('#fm').addEventListener('click',e=>{const t=e.target;
 if(t.id==='at'){const n=$('#nt').value.trim();if(n){if(S.tabs.some(x=>String(x.n).trim().toLowerCase()===n.toLowerCase())){$('#st').textContent='Kategori "'+n+'" sudah ada.';return}S.tabs.push({id:'t'+Date.now(),n});changed();form()}}
 else if(t.id==='ac'){S.cards.push({tab:S.tabs[0].id,t:'Judul baru',s:'Deskripsi',u:'#',img:''});openC=S.cards.length-1;changed();form()}
 else if(t.dataset.mv){const k=t.dataset.mv,i=+k.slice(1),j=k[0]==='u'?i-1:i+1;if(i>0&&j>0&&j<S.tabs.length){[S.tabs[i],S.tabs[j]]=[S.tabs[j],S.tabs[i]];changed();form()}}
 else if(t.dataset.del){const k=t.dataset.del,i=+k.slice(1);if(k[0]==='t'){const tb=S.tabs[i];if(!tb)return;const n=S.cards.filter(c=>c.tab===tb.id).length;if(!confirm('Hapus kategori "'+tb.n+'"'+(n?' beserta '+n+' kartunya':'')+'?'))return;S.tabs.splice(i,1);S.cards=S.cards.filter(c=>c.tab!==tb.id)}else{const c=S.cards[i];if(!c||!confirm('Hapus kartu "'+(c.t||'tanpa judul')+'"?'))return;S.cards.splice(i,1)}openC=-1;changed();form()}});
$('#fm').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nt'){e.preventDefault();$('#at').click()}});
$('#fm').addEventListener('change',e=>{const k=e.target.dataset.up,f=e.target.files&&e.target.files[0];if(!k||!f)return;
 const i=new Image();i.onload=()=>{const m=k==='avatar'?300:600,r=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  const d=c.toDataURL('image/jpeg',.82);if(k==='avatar')S.avatar=d;else if(k==='musicCover')S.musicCover=d;else if(k==='backgroundImage')S.backgroundImage=d;else S.cards[+k.slice(4)].img=d;changed();form()};i.src=URL.createObjectURL(f)});
$('#dlj').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='data.json';a.click();$('#st').textContent='✓ Cadangan data.json terunduh.'};
$('#imp').onclick=()=>$('#impf').click();$('#rl').onclick=reloadServer;
$('#impf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{S=norm(Object.assign({},DEF,JSON.parse(await f.text())));changed();form();sendPv()}catch(x){$('#st').textContent='File JSON tidak valid'}};
const put=()=>fetch(DB+'/site.json?auth='+tok,{method:'PUT',body:JSON.stringify(S)});
$('#pub').onclick=async()=>{if(!useFB){$('#st').textContent='Firebase belum diisi di config.js (lihat panduan).';return}
 $('#st').textContent='Menyimpan...';
 try{let r=await put();if(r.status===401){await fbLogin(cred.email,cred.pw);r=await put()}
  if(r.ok){dirty=false;try{localStorage.removeItem('draft')}catch(e){}$('#st').textContent='✓ Terpublish. Semua orang langsung melihatnya.'}
  else{const t=await r.text();$('#st').textContent='Gagal ('+r.status+'): '+(r.status===401||r.status===403?'cek Rules & akun admin di Firebase.':t.slice(0,80))}}
 catch(e){$('#st').textContent='Gagal: '+e.message}};
</script></body></html>
